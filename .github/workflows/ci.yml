name: CI

on:
  push:
  pull_request:

jobs:
  # Runs the documented install into a throwaway HOME on both supported platforms,
  # then gates on doctor. This is what makes "works on macOS and Linux" a fact rather
  # than a claim — the install path had been broken for both before 0.5.0.
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install into a throwaway HOME
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          mkdir -p "$FAKE"
          HOME="$FAKE" bash install.sh --no-setup
          test -f "$FAKE/.claude/hooks/_hooklib.py"
          test -d "$FAKE/.claude/skills/second-brain"
          test -f "$FAKE/.claude/second-brain-vault/_Home.md"
          test -f "$FAKE/.claude/second-brain-vault/_infra/_install-manifest.json"
          # the test suite must not ship into the user's hooks dir
          ! ls "$FAKE/.claude/hooks/" | grep -q '^test_'

      - name: Doctor must pass on a fresh install
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          VAULT="$FAKE/.claude/second-brain-vault"
          # the wizard is interactive; emulate its one required output
          python3 - "$VAULT/config.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          c = json.load(open(p)); c.pop("_comment", None)
          c["project_map"] = {"demo": "demo"}
          json.dump(c, open(p, "w"), indent=2)
          PY
          HOME="$FAKE" CLAUDE_MEMORY_DIR="$VAULT" \
            python3 "$FAKE/.claude/skills/second-brain/scripts/doctor.py" --strict

      - name: Setup wizard must not hang without a TTY
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          VAULT="$FAKE/.claude/second-brain-vault"
          # `timeout` is GNU coreutils and absent on macOS runners; perl ships on both.
          HOME="$FAKE" CLAUDE_MEMORY_DIR="$VAULT" \
            perl -e 'alarm 30; exec @ARGV or die "exec failed: $!"' -- \
            python3 "$FAKE/.claude/skills/second-brain/scripts/setup.py" < /dev/null

      - name: Virgin vault must be clean
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          VAULT="$FAKE/.claude/second-brain-vault"
          out="$(CLAUDE_MEMORY_DIR="$VAULT" python3 skills/second-brain/scripts/health.py)"
          echo "$out"
          echo "$out" | grep -q "broken wikilinks: 0"
          echo "$out" | grep -q "orphans (no outbound links): 0"

      - name: Uninstall must leave the vault and restore settings
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          HOME="$FAKE" bash uninstall.sh
          test ! -d "$FAKE/.claude/skills/second-brain"
          test -f "$FAKE/.claude/second-brain-vault/_Home.md"   # notes survive
          python3 - "$FAKE/.claude/settings.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert not d.get("hooks"), "hooks should be de-registered: %r" % (d.get("hooks"),)
          print("settings.json clean")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Everything here is stdlib-only — no pip install. server_http_sdk.py is the
      # one file that imports a non-stdlib package (`mcp`), so it is compiled/tested
      # only under its venv (venv-mcp), never in CI.
      - name: Compile (py_compile, stdlib files only)
        run: |
          python3 -m py_compile hooks/*.py skills/second-brain/scripts/*.py
          for f in mcp/*.py; do
            [ "$f" = "mcp/server_http_sdk.py" ] && continue
            python3 -m py_compile "$f"
          done

      - name: Hook tests
        run: |
          for t in hooks/test_*.py; do
            echo "== $t =="
            python3 "$t"
          done

      - name: MCP test
        run: python3 mcp/test_mcp.py

      - name: dedup self-test
        run: python3 skills/second-brain/scripts/dedup.py --selftest

      - name: Exercise scripts against a fixture vault
        run: |
          set -e
          export CLAUDE_MEMORY_DIR="$RUNNER_TEMP/fixture-vault"
          mkdir -p "$CLAUDE_MEMORY_DIR/proj"
          cat > "$CLAUDE_MEMORY_DIR/proj/note-a.md" <<'EOF'
          ---
          name: note-a
          title: Note A
          description: first fixture note
          tags: [tooling, project/proj, type/context]
          asserted: 2020-01-01
          last_confirmed: 2020-01-01
          source: user
          confidence: high
          status: active
          ---
          # Note A
          🟢 **active**
          Links to [[note-b]].
          EOF
          cat > "$CLAUDE_MEMORY_DIR/proj/note-b.md" <<'EOF'
          ---
          name: note-b
          title: Note B
          description: second fixture note
          tags: [tooling, project/proj, type/context]
          asserted: 2020-02-01
          last_confirmed: 2020-02-01
          source: user
          confidence: high
          status: active
          ---
          # Note B
          🟢 **active**
          Back to [[note-a]].
          EOF
          S=skills/second-brain/scripts
          python3 $S/export.py
          python3 $S/graph.py
          python3 $S/stale.py
          python3 $S/health.py
          python3 $S/pull.py note
          python3 $S/find.py note
