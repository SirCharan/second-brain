name: CI

on:
  push:
  pull_request:

jobs:
  # Runs the documented install into a throwaway HOME on both supported platforms,
  # then gates on doctor. This is what makes "works on macOS and Linux" a fact rather
  # than a claim — the install path had been broken for both before 0.5.0.
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install into a throwaway HOME
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          mkdir -p "$FAKE"
          HOME="$FAKE" bash install.sh --no-setup
          test -f "$FAKE/.claude/hooks/_hooklib.py"
          test -d "$FAKE/.claude/skills/second-brain"
          test -f "$FAKE/.claude/second-brain-vault/_Home.md"
          test -f "$FAKE/.claude/second-brain-vault/_infra/_install-manifest.json"
          # the test suite must not ship into the user's hooks dir
          ! ls "$FAKE/.claude/hooks/" | grep -q '^test_'

      - name: Doctor must pass on a fresh install
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          VAULT="$FAKE/.claude/second-brain-vault"
          # the wizard is interactive; emulate its one required output
          python3 - "$VAULT/config.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          c = json.load(open(p)); c.pop("_comment", None)
          c["project_map"] = {"demo": "demo"}
          json.dump(c, open(p, "w"), indent=2)
          PY
          HOME="$FAKE" CLAUDE_MEMORY_DIR="$VAULT" \
            python3 "$FAKE/.claude/skills/second-brain/scripts/doctor.py" --strict

      # Hooks are registered as "<python> <hook>.py" rather than via the .sh wrappers,
      # so the wrappers no longer absorb a crash. Every hook must exit 0 on its own:
      # a non-zero UserPromptSubmit hook blocks the prompt.
      - name: Every hook must run and exit 0
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          VAULT="$FAKE/.claude/second-brain-vault"
          for h in session-memory session-resume memory-recall context-monitor \
                   interview-nudge memory-lint stuck-detector capture-exchange \
                   precompact-carryover; do
            printf '%s' '{"source":"startup","prompt":"ci smoke","cwd":"."}' \
              | HOME="$FAKE" CLAUDE_MEMORY_DIR="$VAULT" python3 "$FAKE/.claude/hooks/$h.py" >/dev/null
            echo "  ok $h"
          done

      - name: Setup wizard must not hang without a TTY
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          VAULT="$FAKE/.claude/second-brain-vault"
          # `timeout` is GNU coreutils and absent on macOS runners; perl ships on both.
          HOME="$FAKE" CLAUDE_MEMORY_DIR="$VAULT" \
            perl -e 'alarm 30; exec @ARGV or die "exec failed: $!"' -- \
            python3 "$FAKE/.claude/skills/second-brain/scripts/setup.py" < /dev/null

      - name: Virgin vault must be clean
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          VAULT="$FAKE/.claude/second-brain-vault"
          out="$(CLAUDE_MEMORY_DIR="$VAULT" python3 skills/second-brain/scripts/health.py)"
          echo "$out"
          echo "$out" | grep -q "broken wikilinks: 0"
          echo "$out" | grep -q "orphans (no outbound links): 0"

      # The pack is opt-in, so the default install must not have pulled it in, and an
      # explicit --pack=all must land every tier plus the vault content.
      - name: Starter pack installs on request and not by default
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          VAULT="$FAKE/.claude/second-brain-vault"
          test ! -d "$FAKE/.claude/skills/gtan-workflow"   # --no-setup declined it
          HOME="$FAKE" CLAUDE_MEMORY_DIR="$VAULT" bash install.sh --no-setup --pack=all
          test -d "$FAKE/.claude/skills/gtan-workflow"
          test -d "$FAKE/.claude/skills/design-router"
          test -f "$FAKE/.claude/workflows/vault-restructure.js"
          test -f "$VAULT/_playbook/session-habits.md"
          test -f "$VAULT/.obsidian/graph.json"
          test -f "$VAULT/_system/skills/skill-gtan-workflow.md"
          grep -q '_MOC-playbook' "$VAULT/_Home.md"
          # the seeded notes must not introduce broken links or orphans
          out="$(CLAUDE_MEMORY_DIR="$VAULT" python3 skills/second-brain/scripts/health.py)"
          echo "$out" | grep -q "broken wikilinks: 0"
          echo "$out" | grep -q "orphans (no outbound links): 0"
          # a second run must change nothing
          HOME="$FAKE" CLAUDE_MEMORY_DIR="$VAULT" \
            python3 "$FAKE/.claude/skills/second-brain/scripts/starter-pack.py" --tiers all \
            | grep -q '0 skill(s)'
          HOME="$FAKE" CLAUDE_MEMORY_DIR="$VAULT" \
            python3 "$FAKE/.claude/skills/second-brain/scripts/doctor.py" --strict

      - name: Uninstall must leave the vault and restore settings
        run: |
          set -euo pipefail
          FAKE="$RUNNER_TEMP/fakehome"
          HOME="$FAKE" bash uninstall.sh
          test ! -d "$FAKE/.claude/skills/second-brain"
          test ! -d "$FAKE/.claude/skills/gtan-workflow"        # starter pack goes too
          test ! -f "$FAKE/.claude/workflows/vault-restructure.js"
          test -f "$FAKE/.claude/second-brain-vault/_Home.md"   # notes survive
          test -f "$FAKE/.claude/second-brain-vault/_playbook/session-habits.md"
          python3 - "$FAKE/.claude/settings.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert not d.get("hooks"), "hooks should be de-registered: %r" % (d.get("hooks"),)
          print("settings.json clean")
          PY

  # Native Windows: no bash, no /usr/bin/python3, no symlink privilege. This job is the
  # only proof the PowerShell installer and the python-direct hook registrations work
  # there, so "Windows is supported" in the README depends on it staying green.
  install-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install into a throwaway config dir
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "fake"
          New-Item -ItemType Directory -Force -Path $fake | Out-Null
          $env:CLAUDE_CONFIG_DIR = Join-Path $fake ".claude"
          $env:CLAUDE_MEMORY_DIR = Join-Path $fake "vault"
          .\install.ps1 -NoSetup -Pack all
          # the machinery landed
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "hooks\_hooklib.py"))) { throw "hooks missing" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "hooks\session-memory.py"))) { throw "session-memory.py missing" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_MEMORY_DIR "_Home.md"))) { throw "vault missing" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_MEMORY_DIR "_infra\_install-manifest.json"))) { throw "manifest missing" }
          # the starter pack landed
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "skills\gtan-workflow"))) { throw "pack missing" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_MEMORY_DIR ".obsidian\graph.json"))) { throw "obsidian config missing" }
          # the test suite must not ship into the user's hooks dir
          if (Get-ChildItem (Join-Path $env:CLAUDE_CONFIG_DIR "hooks") -Filter "test_*") { throw "tests shipped" }

      - name: Registrations must name a real interpreter, not bash
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "fake"
          $settings = Join-Path $fake ".claude\settings.json"
          $cmds = (Get-Content $settings -Raw | ConvertFrom-Json).hooks.PSObject.Properties.Value |
                  ForEach-Object { $_.hooks } | ForEach-Object { $_.command }
          if ($cmds | Where-Object { $_ -match 'bash ' }) { throw "a hook still shells out to bash" }
          if (-not ($cmds | Where-Object { $_ -match 'session-memory\.py' })) { throw "session-memory not registered" }
          $cmds | ForEach-Object { Write-Host $_ }

      - name: Every hook must run and exit 0
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "fake"
          $env:CLAUDE_MEMORY_DIR = Join-Path $fake "vault"
          $hooks = Join-Path $fake ".claude\hooks"
          $payload = '{"source":"startup","prompt":"windows smoke test","cwd":"."}'
          foreach ($h in @("session-memory", "session-resume", "memory-recall", "context-monitor",
                           "interview-nudge", "memory-lint", "stuck-detector", "capture-exchange",
                           "precompact-carryover")) {
            $payload | python (Join-Path $hooks "$h.py") | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$h exited $LASTEXITCODE" }
            Write-Host "  ok $h"
          }

      - name: Doctor must pass
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "fake"
          $env:CLAUDE_CONFIG_DIR = Join-Path $fake ".claude"
          $env:CLAUDE_MEMORY_DIR = Join-Path $fake "vault"
          $cfg = Join-Path $env:CLAUDE_MEMORY_DIR "config.json"
          $c = Get-Content $cfg -Raw | ConvertFrom-Json
          $c.PSObject.Properties.Remove("_comment")
          $c | Add-Member -NotePropertyName project_map -NotePropertyValue @{ demo = "demo" } -Force
          $c | ConvertTo-Json -Depth 9 | Set-Content $cfg
          python (Join-Path $env:CLAUDE_CONFIG_DIR "skills\second-brain\scripts\doctor.py") --strict

      - name: Starter pack + hook tests
        shell: pwsh
        run: |
          python tests\test_starter_pack.py
          Get-ChildItem hooks -Filter "test_*.py" | ForEach-Object {
            Write-Host "== $($_.Name) =="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($_.Name) failed" }
          }

      - name: Uninstall must leave the vault
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "fake"
          $env:CLAUDE_CONFIG_DIR = Join-Path $fake ".claude"
          $env:CLAUDE_MEMORY_DIR = Join-Path $fake "vault"
          .\uninstall.ps1
          if (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "skills\second-brain")) { throw "skill survived" }
          if (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR "skills\gtan-workflow")) { throw "pack survived" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_MEMORY_DIR "_Home.md"))) { throw "notes were deleted" }
          $d = Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR "settings.json") -Raw | ConvertFrom-Json
          if ($d.hooks) { throw "hooks still registered" }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Everything here is stdlib-only — no pip install. server_http_sdk.py is the
      # one file that imports a non-stdlib package (`mcp`), so it is compiled/tested
      # only under its venv (venv-mcp), never in CI.
      - name: Compile (py_compile, stdlib files only)
        run: |
          python3 -m py_compile hooks/*.py skills/second-brain/scripts/*.py
          for f in mcp/*.py; do
            [ "$f" = "mcp/server_http_sdk.py" ] && continue
            python3 -m py_compile "$f"
          done

      - name: Hook tests
        run: |
          for t in hooks/test_*.py; do
            echo "== $t =="
            python3 "$t"
          done

      - name: Starter pack tests
        run: python3 tests/test_starter_pack.py

      - name: MCP test
        run: python3 mcp/test_mcp.py

      - name: dedup self-test
        run: python3 skills/second-brain/scripts/dedup.py --selftest

      # The eval harness is the only thing that can tell whether a ranking change helped.
      # It runs against the user's own vault, so CI cannot check a real score — it checks
      # that the miner and the scorer still work end to end on a synthetic vault.
      - name: Recall eval harness round-trip
        run: |
          set -euo pipefail
          export CLAUDE_MEMORY_DIR="$RUNNER_TEMP/eval-vault"
          export SECOND_BRAIN_STATE_DIR="$RUNNER_TEMP/eval-state"
          mkdir -p "$CLAUDE_MEMORY_DIR/Daily" "$CLAUDE_MEMORY_DIR/widgets"
          for n in cache-tuning retry-backoff schema-migration; do
            cat > "$CLAUDE_MEMORY_DIR/widgets/$n.md" <<EOF
          ---
          name: $n
          description: notes about $n in the widgets service
          asserted: 2026-01-01
          last_confirmed: 2026-01-01
          status: active
          ---
          # $n
          🟢 **active**
          EOF
          done
          cat > "$CLAUDE_MEMORY_DIR/Daily/2026-01-02.md" <<'EOF'
          # Daily
          - **10:00** [widgets] — (win) Tuned the widgets cache and measured the hit rate || links: [[cache-tuning]]
          - **11:00** [widgets] — (fix) Added retry backoff to the widgets client || links: [[retry-backoff]]
          - **12:00** [widgets] — (raw) [Image: source: /tmp/x.png]
          - **13:00** [widgets] — (decision) Planned the widgets schema migration rollout || links: [[schema-migration]]
          EOF
          python3 tests/eval/build_set.py -o "$RUNNER_TEMP/q.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/q.jsonl")" -eq 3   # the (raw) line must be skipped
          out="$(python3 tests/eval/run_eval.py "$RUNNER_TEMP/q.jsonl" --save "$RUNNER_TEMP/base.json")"
          echo "$out"
          echo "$out" | grep -q 'hit@4 1.000'   # an exact-word fixture must score perfectly
          # --gate must fail a regression rather than pass it silently
          python3 - "$RUNNER_TEMP/base.json" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p))
          d["hit@4"] = 1.0; d["mrr"] = 1.0
          json.dump(d, open(p, "w"))
          PY
          python3 tests/eval/run_eval.py "$RUNNER_TEMP/q.jsonl" --head-gate 99 \
            --compare "$RUNNER_TEMP/base.json" --gate && { echo "gate failed to catch a regression"; exit 1; } || true

      - name: Exercise scripts against a fixture vault
        run: |
          set -e
          export CLAUDE_MEMORY_DIR="$RUNNER_TEMP/fixture-vault"
          mkdir -p "$CLAUDE_MEMORY_DIR/proj"
          cat > "$CLAUDE_MEMORY_DIR/proj/note-a.md" <<'EOF'
          ---
          name: note-a
          title: Note A
          description: first fixture note
          tags: [tooling, project/proj, type/context]
          asserted: 2020-01-01
          last_confirmed: 2020-01-01
          source: user
          confidence: high
          status: active
          ---
          # Note A
          🟢 **active**
          Links to [[note-b]].
          EOF
          cat > "$CLAUDE_MEMORY_DIR/proj/note-b.md" <<'EOF'
          ---
          name: note-b
          title: Note B
          description: second fixture note
          tags: [tooling, project/proj, type/context]
          asserted: 2020-02-01
          last_confirmed: 2020-02-01
          source: user
          confidence: high
          status: active
          ---
          # Note B
          🟢 **active**
          Back to [[note-a]].
          EOF
          S=skills/second-brain/scripts
          python3 $S/export.py
          python3 $S/graph.py
          python3 $S/stale.py
          python3 $S/health.py
          python3 $S/pull.py note
          python3 $S/find.py note
